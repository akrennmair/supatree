version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        update-types: [minor, patch]
    ignore:
      # Bumped by hand to a merged workbench commit (see AGENTS.md), never to a tag.
      - dependency-name: github.com/panamafrancis/workbench
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
